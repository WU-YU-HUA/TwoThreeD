</style></head><body><main><header><a href="./">← 回圖面工作室</a><h1>原創設備模型</h1><p>六個無品牌的通用模型，可拖曳旋轉、滾輪縮放。每款可設定外殼或板框顏色，會同步至圖面預覽及 DAE，保留其他配件材質；GLB 連結提供原始模型。放進圖面後會依物件框線等比例調整，模型原始尺寸只用來決定外形比例。兩款支架白板採圖上完整 W／D／H 尺寸。飲水機有桌／櫃承載時選檯上款，沒有承載物時選落地款。</p></header><section class="models" id="models" aria-label="模型預覽"></section><footer>原創模型採 CC0-1.0，生成原始碼保留在專案 scripts/generate-model-assets.mjs。<a href="assets/models/generated/SOURCES.txt">來源與使用說明</a>。模型為空間配置示意，非精確產品 CAD。</footer></main><script type="module" src="js/model-library.js"></script></body></html>
